
name: Build MusicTap APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract MusicTap source
        shell: bash
        run: |
          set -e

          if [ ! -f "MusicTap-Android-Source.zip" ]; then
            echo "ERROR: MusicTap-Android-Source.zip not found in repository root."
            exit 1
          fi

          unzip -o MusicTap-Android-Source.zip -d extracted

          PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project settings.gradle.kts not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

      - name: Replace MainActivity source
        shell: bash
        run: |
          set -e

          TARGET="$PROJECT_DIR/app/src/main/java/com/example/musictap/MainActivity.kt"

          if [ ! -f "$GITHUB_WORKSPACE/MainActivity.kt" ]; then
            echo "ERROR: MainActivity.kt not found in repository root."
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET")"
          cp "$GITHUB_WORKSPACE/MainActivity.kt" "$TARGET"

          echo "MainActivity.kt copied successfully."

      - name: Verify Android source files
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/app/src/main/java/com/example/musictap/MainActivity.kt"
          SERVICE="$PROJECT_DIR/app/src/main/java/com/example/musictap/PianoAccessibilityService.kt"

          echo "Checking MainActivity.kt..."
          test -f "$MAIN"

          if grep -n "intValue()" "$MAIN"; then
            echo "ERROR: Old intValue() code detected."
            exit 1
          fi

          if ! grep -q "fun readInt" "$MAIN"; then
            echo "ERROR: readInt() method is missing."
            exit 1
          fi

          echo "Checking PianoAccessibilityService.kt..."
          test -f "$SERVICE"

          echo "Both Kotlin source files are present."
          echo "Source verification successful."

      - name: Build debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK generated successfully."
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MusicTap-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
